<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northwind - Redirección</title>
    <style id="antiClickjack">html { display: none !important; }</style>
    <script>
        (function () {
            var framed = false;
            try {
                framed = window.self !== window.top;
            } catch (e) {
                framed = true;
            }
            if (!framed) {
                var s = document.getElementById('antiClickjack');
                if (s) s.remove();
            } else {
                document.documentElement.style.setProperty('display', 'none', 'important');
                try { window.top.location = window.self.location.href; } catch (e) {}
                try { window.stop(); } catch (e) {}
                document.addEventListener('DOMContentLoaded', function () {
                    if (document.body) document.body.remove();
                });
            }
        })();
    </script>
    <meta http-equiv="refresh" content="0; url=./login.html">
    <script>
        if (window.self === window.top) {
            window.location.href = './login.html';
        }
    </script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="text-center">
        <p class="text-muted">Redirigiendo a <a href="./login.html">Iniciar Sesión</a>...</p>
    </div>
</body>
</html>
