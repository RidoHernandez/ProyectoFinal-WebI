<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northwind - Gestión de Clientes</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- DataTables + Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/3.0.3/css/responsive.bootstrap5.min.css">
</head>
<body class="bg-light">
    <!-- Barra de Navegación Principal -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="./productos.html">Northwind API</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navPrincipal"
                    aria-controls="navPrincipal" aria-expanded="false" aria-label="Mostrar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navPrincipal">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item" id="navItemProductos">
                        <a class="nav-link" id="navProductos" href="./productos.html">Productos</a>
                    </li>
                    <li class="nav-item" id="navItemCatalogo">
                        <a class="nav-link" id="navCatalogo" href="./catalogo.html">Catálogo</a>
                    </li>
                    <li class="nav-item" id="navItemClientes">
                        <a class="nav-link active fw-bold" id="navClientes" aria-current="page" href="./clientes.html">Clientes</a>
                    </li>
                    <li class="nav-item" id="navItemPedidos">
                        <a class="nav-link" id="navPedidos" href="./pedidos.html">Pedidos</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <span class="text-light small d-flex align-items-center gap-1 me-2">
                        Usuario: <strong id="lblUsuario" class="text-info">Cargando...</strong>
                        <span id="badgeRol" class="badge rounded-pill bg-secondary ms-1">ROL</span>
                    </span>
                    <button id="btnPerfilApiKey" type="button" class="btn btn-outline-warning btn-sm">Mi API Key</button>
                    <button id="btnLogout" type="button" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container-fluid px-4 py-4">
        <div id="alertContainer403"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h2 class="fw-bold mb-0">Directorio de Clientes</h2>
                <small class="text-muted">Consulta de clientes corporativos (Backend: /api/customers)</small>
            </div>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <table id="tablaClientes" class="table table-striped table-hover align-middle w-100">
                    <caption class="visually-hidden">Listado de clientes Northwind</caption>
                    <thead class="table-dark">
                        <tr>
                            <th>Código Cliente</th>
                            <th>Empresa / Compañía</th>
                            <th>Contacto</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyClientes"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- jQuery (requerido por DataTables) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables + Bootstrap 5 JS -->
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/3.0.3/js/dataTables.responsive.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/3.0.3/js/responsive.bootstrap5.min.js"></script>
    <!-- Controlador exclusivo de Clientes -->
    <script type="module" src="../controllers/customersController.js"></script>
</body>
</html>
