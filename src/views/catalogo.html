<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northwind - Catálogo Comercial</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <!-- Barra de Navegación Principal -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="./catalogo.html">Northwind API</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navPrincipal"
                    aria-controls="navPrincipal" aria-expanded="false" aria-label="Mostrar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navPrincipal">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item" id="navItemProductos">
                        <a class="nav-link" id="navProductos" href="./productos.html">Productos</a>
                    </li>
                    <li class="nav-item" id="navItemCatalogo">
                        <a class="nav-link active fw-bold" id="navCatalogo" aria-current="page" href="./catalogo.html">Catálogo</a>
                    </li>
                    <li class="nav-item" id="navItemClientes">
                        <a class="nav-link" id="navClientes" href="./clientes.html">Clientes</a>
                    </li>
                    <li class="nav-item" id="navItemPedidos">
                        <a class="nav-link" id="navPedidos" href="./pedidos.html">Pedidos</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <span class="text-light small d-flex align-items-center gap-1 me-2">
                        Usuario: <strong id="lblUsuario" class="text-info">Cargando...</strong>
                        <span id="badgeRol" class="badge rounded-pill bg-secondary ms-1">ROL</span>
                    </span>
                    <button id="btnPerfilApiKey" type="button" class="btn btn-outline-warning btn-sm">Mi API Key</button>
                    <button id="btnLogout" type="button" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container-fluid px-4 py-4">
        <div id="alertContainer403"></div>

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
            <div>
                <h2 class="fw-bold mb-0">Catálogo Comercial de Productos</h2>
                <small class="text-muted">Consulta de precios y disponibilidad en inventario</small>
            </div>
            <span id="lblTotalCatalogo" class="badge bg-primary-subtle text-primary fs-6">Cargando...</span>
        </div>

        <!-- Barra de búsqueda y filtros en tiempo real -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-12 col-md-5">
                        <label for="txtBuscarCatalogo" class="form-label small fw-semibold text-secondary mb-1">Buscar producto</label>
                        <input type="search" id="txtBuscarCatalogo" class="form-control" placeholder="Filtrar por nombre de producto...">
                    </div>
                    <div class="col-12 col-md-4">
                        <label for="txtPrecioMaxCatalogo" class="form-label small fw-semibold text-secondary mb-1">Precio máximo (USD)</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" id="txtPrecioMaxCatalogo" class="form-control" min="0" step="0.01" placeholder="Sin límite">
                        </div>
                    </div>
                    <div class="col-12 col-md-3">
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" role="switch" id="chkSoloDisponibles">
                            <label class="form-check-label small fw-semibold" for="chkSoloDisponibles">Solo con stock disponible</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cuadrícula de tarjetas de productos -->
        <div id="contenedorCatalogo" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-3"></div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Controlador exclusivo de Catálogo -->
    <script type="module" src="../controllers/catalogController.js"></script>
</body>
</html>
